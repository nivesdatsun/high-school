<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerbQuest: Irregular Verb Master | Mrs. Torresi's Class</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f5ff',
              100: '#e0ebff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          animation: {
            'bounce-short': 'bounce 0.5s ease-in-out 1',
            'pulse-glow': 'pulseGlow 2s infinite',
          },
          keyframes: {
            pulseGlow: {
              '0%, 100%': { boxShadow: '0 0 15px rgba(99, 102, 241, 0.4)' },
              '50%': { boxShadow: '0 0 25px rgba(99, 102, 241, 0.8)' },
            }
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* 3D Card Flip Styles */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    
    /* Canvas Overlay */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: #a5b4fc;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #4338ca;
    }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300 font-sans flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Notification Toast -->
  <div id="toast-notification" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 border border-slate-700">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
    <span id="toast-message" class="text-xs sm:text-sm font-semibold">Notification message</span>
  </div>

  <!-- Navigation Header -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Logo & Title -->
        <div class="flex items-center space-x-3">
          <!-- Back to Hub Button -->
          <a href="index.html" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-slate-700 transition flex items-center justify-center mr-1 shadow-sm" title="Back to Class Hub">
            <i class="fa-solid fa-arrow-left text-sm"></i>
          </a>

          <div class="flex items-center space-x-2.5 cursor-pointer" onclick="switchTab('flashcards')">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 transform hover:scale-105 transition">
              <i class="fa-solid font-bold fa-wand-magic-sparkles text-lg"></i>
            </div>
            <div>
              <div class="flex items-center space-x-2">
                <span class="text-xl font-black bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 bg-clip-text text-transparent tracking-tight">VerbQuest</span>
                <span class="hidden sm:inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300">Irregular Master</span>
              </div>
              <p class="text-[10px] text-slate-500 dark:text-slate-400 font-semibold leading-none hidden md:block">Created for Mrs. Nives Torresi's Classes</p>
            </div>
          </div>
        </div>

        <!-- User Level & Stats Gauge -->
        <div class="hidden md:flex items-center space-x-4 bg-slate-100 dark:bg-slate-800/70 py-1.5 px-3.5 rounded-2xl border border-slate-200/60 dark:border-slate-700/60">
          <div class="flex items-center space-x-2">
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400" id="user-level-title">Lv.1 Novice</span>
            <div class="w-24 h-2.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
              <div id="user-xp-bar" class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-500" style="width: 0%"></div>
            </div>
            <span class="text-xs font-bold text-slate-500 dark:text-slate-400" id="user-xp-text">0/100 XP</span>
          </div>
          <div class="h-4 w-px bg-slate-300 dark:bg-slate-700"></div>
          <div class="flex items-center space-x-1.5 text-amber-500 font-extrabold text-sm" title="Current Correct Answer Streak">
            <i class="fa-solid fa-fire text-amber-500 animate-bounce-short"></i>
            <span id="header-streak">0</span>
          </div>
        </div>

        <!-- Header Action Buttons -->
        <div class="flex items-center space-x-2">
          <!-- Claim Certificate Button -->
          <button onclick="openCertificateModal()" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-950 font-black text-xs shadow-md shadow-amber-500/20 transition transform hover:scale-105 flex items-center space-x-1.5">
            <i class="fa-solid fa-award text-sm"></i>
            <span class="hidden sm:inline">Certificate</span>
          </button>

          <!-- Export Progress Dropdown Button -->
          <div class="relative group">
            <button class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-xs transition flex items-center space-x-1.5">
              <i class="fa-solid fa-download text-indigo-500"></i>
              <span class="hidden lg:inline">Report</span>
              <i class="fa-solid fa-chevron-down text-[10px]"></i>
            </button>
            <div class="absolute right-0 mt-1 w-52 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl py-2 hidden group-hover:block z-50">
              <button onclick="exportProgressReportTXT()" class="w-full text-left px-4 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-slate-800 flex items-center space-x-2">
                <i class="fa-solid fa-file-lines text-purple-500"></i>
                <span>Download Report Card (.TXT)</span>
              </button>
              <button onclick="exportProgressJSON()" class="w-full text-left px-4 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-slate-800 flex items-center space-x-2">
                <i class="fa-solid fa-file-code text-indigo-500"></i>
                <span>Backup Progress (.JSON)</span>
              </button>
              <label class="w-full text-left px-4 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-slate-800 flex items-center space-x-2 cursor-pointer">
                <i class="fa-solid fa-file-import text-emerald-500"></i>
                <span>Load Saved Progress</span>
                <input type="file" id="import-json-input" accept=".json" onchange="importProgressJSON(event)" class="hidden">
              </label>
            </div>
          </div>

          <!-- Sound FX Toggle -->
          <button id="btn-sound-toggle" onclick="toggleSound()" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle Sound FX">
            <i class="fa-solid fa-volume-high text-base"></i>
          </button>
          
          <!-- Speech Speed -->
          <button id="btn-speech-speed" onclick="toggleSpeechSpeed()" class="px-2.5 py-1 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-slate-700 transition" title="Speech Audio Speed">
            <i class="fa-solid fa-gauge-high mr-1 text-indigo-500"></i><span id="speech-speed-text">1.0x</span>
          </button>

          <!-- Dark Mode Toggle -->
          <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle Dark/Light Mode">
            <i class="fa-solid fa-moon text-base dark:hidden"></i>
            <i class="fa-solid fa-sun text-base hidden dark:inline-block text-amber-400"></i>
          </button>
        </div>

      </div>

      <!-- Navigation Tabs Bar -->
      <div class="flex space-x-1 overflow-x-auto pb-2 scrollbar-none border-t border-slate-100 dark:border-slate-800/60 pt-2">
        <button id="tab-btn-flashcards" onclick="switchTab('flashcards')" class="tab-btn active px-4 py-2 rounded-xl font-bold text-sm flex items-center space-x-2 whitespace-nowrap transition bg-indigo-600 text-white shadow-md">
          <i class="fa-solid fa-layer-group"></i>
          <span>Flashcards</span>
        </button>

        <button id="tab-btn-matching" onclick="switchTab('matching')" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm flex items-center space-x-2 whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i class="fa-solid fa-puzzle-piece"></i>
          <span>Matching Game</span>
        </button>

        <button id="tab-btn-quiz" onclick="switchTab('quiz')" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm flex items-center space-x-2 whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i class="fa-solid fa-pen-to-square"></i>
          <span>Sentence Quiz</span>
        </button>

        <button id="tab-btn-speed" onclick="switchTab('speed')" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm flex items-center space-x-2 whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i class="fa-solid fa-bolt text-amber-400"></i>
          <span>Speed Arcade</span>
        </button>

        <button id="tab-btn-vault" onclick="switchTab('vault')" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm flex items-center space-x-2 whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i class="fa-solid fa-book-bookmark"></i>
          <span>Verb Vault & Stats</span>
        </button>

        <button id="tab-btn-teacher" onclick="switchTab('teacher')" class="tab-btn px-4 py-2 rounded-xl font-bold text-sm flex items-center space-x-2 whitespace-nowrap transition text-rose-600 dark:text-rose-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i class="fa-solid fa-user-graduate text-rose-500"></i>
          <span>About Mrs. Torresi</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Dynamic View Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- TAB 1: FLASHCARD STUDY MODE -->
    <section id="tab-view-flashcards" class="space-y-6">
      <!-- Filter Bar -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800 flex flex-wrap gap-3 items-center justify-between">
        <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
          <!-- Level Filter -->
          <div class="flex items-center space-x-2">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Level:</span>
            <select id="flashcard-filter-level" onchange="renderFlashcardDeck()" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="ALL">All Levels</option>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Advanced">Advanced</option>
            </select>
          </div>

          <!-- Pattern Filter -->
          <div class="flex items-center space-x-2">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Pattern:</span>
            <select id="flashcard-filter-pattern" onchange="renderFlashcardDeck()" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="ALL">All Patterns</option>
              <option value="All Three Same">All Three Same (cut-cut-cut)</option>
              <option value="Past = Participle (A-B-B)">Past = Participle (buy-bought-bought)</option>
              <option value="Vowel Swap (i-a-u)">Vowel Swap (sing-sang-sung)</option>
              <option value="A-B-A Pattern">A-B-A Pattern (run-ran-run)</option>
              <option value="-en Participle">-en Participle (break-broke-broken)</option>
              <option value="Mixed A-B-C">Mixed A-B-C (go-went-gone)</option>
            </select>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
          <input type="text" id="flashcard-search" oninput="renderFlashcardDeck()" placeholder="Search verb (e.g. speak)..." class="w-full pl-9 pr-3 py-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <!-- Flashcard Arena Container -->
      <div class="flex flex-col items-center justify-center min-h-[420px] relative">
        <div id="flashcard-wrapper" class="w-full max-w-lg perspective-1000 cursor-pointer" onclick="flipCurrentCard()">
          <div id="flashcard-card" class="transform-style-3d relative w-full h-[360px] rounded-3xl shadow-xl transition-transform duration-500">
            
            <!-- FRONT SIDE -->
            <div class="backface-hidden absolute inset-0 bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-800 rounded-3xl p-8 flex flex-col justify-between text-white border border-indigo-500/30 shadow-2xl overflow-hidden">
              <div class="absolute -right-10 -bottom-10 opacity-10 text-white pointer-events-none">
                <i class="fa-solid fa-graduation-cap text-[220px]"></i>
              </div>

              <!-- Card Header Info -->
              <div class="flex items-center justify-between z-10">
                <span id="fc-front-pattern" class="text-xs font-bold px-3 py-1 rounded-full bg-white/20 backdrop-blur-md border border-white/20 uppercase tracking-wider">Pattern Tag</span>
                <span id="fc-front-level" class="text-xs font-bold px-3 py-1 rounded-full bg-amber-400/30 text-amber-200 border border-amber-300/30">Beginner</span>
              </div>

              <!-- Main Base Verb -->
              <div class="text-center my-auto z-10 space-y-2">
                <span class="text-xs font-semibold tracking-widest uppercase text-indigo-200">BASE FORM (V1)</span>
                <div class="flex items-center justify-center space-x-3">
                  <h2 id="fc-front-base" class="text-5xl font-black tracking-tight text-white drop-shadow-md">WRITE</h2>
                  <button onclick="event.stopPropagation(); speakText(currentCardVerb.base)" class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 backdrop-blur-md flex items-center justify-center transition" title="Listen Pronunciation">
                    <i class="fa-solid fa-volume-high text-lg"></i>
                  </button>
                </div>
                <p id="fc-front-hint" class="text-xs text-indigo-200/80 italic pt-2">Tap card to reveal past forms & example</p>
              </div>

              <!-- Card Footer Flip Indicator -->
              <div class="flex items-center justify-between z-10 text-xs text-indigo-200/70 font-medium">
                <span id="fc-mastered-badge" class="flex items-center space-x-1 hidden text-amber-300">
                  <i class="fa-solid fa-star"></i> <span>Mastered</span>
                </span>
                <span class="ml-auto flex items-center space-x-1 text-white/80">
                  <span>Flip Card</span> <i class="fa-solid fa-rotate text-xs"></i>
                </span>
              </div>
            </div>

            <!-- BACK SIDE -->
            <div class="backface-hidden rotate-y-180 absolute inset-0 bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 flex flex-col justify-between text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400" id="fc-back-pattern">Pattern Breakdown</span>
                <button onclick="event.stopPropagation(); toggleMastery(currentCardVerb.base)" id="btn-master-card" class="text-xs font-bold px-3 py-1 rounded-full border border-amber-300 bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-300 hover:bg-amber-100 transition flex items-center space-x-1">
                  <i class="fa-regular fa-star" id="fc-star-icon"></i>
                  <span id="fc-star-text">Mark Mastered</span>
                </button>
              </div>

              <!-- 3 Forms Grid -->
              <div class="grid grid-cols-3 gap-2 my-auto bg-slate-50 dark:bg-slate-800/60 p-3.5 rounded-2xl border border-slate-100 dark:border-slate-700/60 text-center">
                <div class="space-y-1">
                  <span class="text-[10px] font-bold uppercase text-slate-400">V1 (Base)</span>
                  <div class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center justify-center space-x-1">
                    <span id="fc-back-v1">write</span>
                    <button onclick="event.stopPropagation(); speakText(currentCardVerb.base)" class="text-xs text-indigo-500 hover:text-indigo-600"><i class="fa-solid fa-volume-high"></i></button>
                  </div>
                </div>
                <div class="space-y-1 border-x border-slate-200 dark:border-slate-700 px-1">
                  <span class="text-[10px] font-bold uppercase text-indigo-500">V2 (Past)</span>
                  <div class="font-black text-lg text-indigo-
