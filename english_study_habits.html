<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High School Students - Study Guide: Ultimate Habits</title>
    <style>
        :root {
            --bg-sea: #0f3854;            /* Rich Deep Sea Blue */
            --bg-header: #0a273c;         /* Dark Ocean Blue */
            --card-bg: #174e75;           /* Vibrant Sea Blue Card */
            --accent-gold: #fbbf24;        /* Golden Yellow */
            --accent-cyan: #22d3ee;        /* Bright Aqua Cyan */
            --text-light: #f8fafc;
            --text-muted: #93c5fd;
            --border-color: #2563eb;
            --inner-box: #0b2a42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-sea);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        header {
            background-color: var(--bg-header);
            padding: 1rem 1.5rem;
            border-bottom: 2px solid #1d4ed8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .badge {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0b2a42;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        select, button {
            background: #1e5882;
            color: var(--text-light);
            border: 1px solid #3b82f6;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        button:hover {
            background: #2563eb;
            border-color: var(--accent-cyan);
        }

        .btn-accent {
            background: var(--accent-cyan);
            color: #0b2a42;
            font-weight: 700;
            border: none;
        }

        .btn-accent:hover {
            background: #67e8f9;
        }

        /* Slide Viewer Area */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }
